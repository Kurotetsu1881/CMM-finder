<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>CMM Finder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        [hidden] { display: none !important; }

        .glass {
            background: rgba(17, 24, 39, 0.75);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
        }

        .search-box {
            width: 100%;
            height: 48px;
            padding: 0 44px 0 16px;
            font-size: 16px;
            letter-spacing: 0.04em;
            color: #ffffff;
            -webkit-text-fill-color: #ffffff;
            text-transform: uppercase;
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 12px;
        }
        .search-box::placeholder { color: #9ca3af; text-transform: none; letter-spacing: 0; }
        .search-box:focus { outline: none; border-color: #ef4444; }
        #inputWrap { position: relative; width: 100%; }
        #clearBtn {
            position: absolute; right: 2px; top: 2px;
            width: 44px; height: 44px;
            font-size: 26px; line-height: 1;
            color: #cbd5e1; background: transparent; border: 0; cursor: pointer;
        }
        #clearBtn:hover { color: #ffffff; }

        #searchSection.hero { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; }
        #searchSection.hero #searchPanel {
            width: 100%; max-width: 720px;
            padding: 32px 20px; border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(148, 163, 184, 0.28);
        }
        #searchSection.hero #inputWrap { max-width: 600px; margin: 20px auto 0; }
        #searchSection.hero .search-box { height: 56px; font-size: 19px; border: 2px solid #ef4444; border-radius: 14px; }

        #searchSection:not(.hero) { flex: 0 0 auto; margin-bottom: 10px; }
        #searchSection:not(.hero) #searchPanel {
            display: flex; flex-wrap: wrap; align-items: center;
            gap: 10px 16px; padding: 10px 14px; border-radius: 14px;
            border: 1px solid rgba(55, 65, 81, 0.5);
        }
        #searchSection:not(.hero) #inputWrap { max-width: 360px; }

        .chip {
            display: inline-flex; align-items: center;
            min-height: 36px; padding: 0 14px;
            font-size: 13px; font-weight: 600; color: #e5e7eb;
            background: rgba(8, 20, 40, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 9999px; cursor: pointer;
        }
        .chip:hover { border-color: #ef4444; }

        .btn-ghost {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 40px; padding: 0 14px;
            font-size: 13px; font-weight: 600; color: #f1f5f9; text-decoration: none;
            background: rgba(8, 20, 40, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 10px; cursor: pointer;
        }
        .btn-ghost:hover { border-color: #ef4444; }

        .table-wrap { border: 1px solid rgba(55, 65, 81, 0.5); }
        .head-bar {
            background: rgba(17, 24, 39, 0.85);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid rgba(239, 68, 68, 0.6);
            color: #e5e7eb;
        }
        .body-scroll { background: rgba(3, 7, 18, 0.82); }

        .icon-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 38px; height: 38px; margin: -6px 0;
            color: #9ca3af; background: none; border: 0; cursor: pointer;
            vertical-align: middle;
        }
        .icon-btn:hover { color: #f87171; }
        .edit-txt { display: none; }

        /* Mobil Cihazlar: Kart Görünümü */
        @media (max-width: 640px) {
            #headWrap { display: none; }
            #dataTable, #dataTable tbody, #dataTable tr, #dataTable td { display: block; width: 100%; }
            #dataTable tr { 
                padding: 12px; 
                margin-bottom: 8px; 
                background: rgba(17, 24, 39, 0.5); 
                border-radius: 12px; 
                border: 1px solid rgba(55, 65, 81, 0.4); 
            }
            #dataTable td { padding: 4px 0 !important; white-space: normal !important; overflow: visible !important; border: none !important; }
            #dataTable td::before {
                content: attr(data-label);
                display: inline-block; min-width: 90px;
                color: #9ca3af; font-size: 11px; font-weight: 600;
                text-transform: uppercase; letter-spacing: 0.04em;
            }
            #dataTable td.cell-act {
                display: flex; justify-content: flex-end; margin-top: 6px; padding-top: 8px !important; border-top: 1px solid rgba(55, 65, 81, 0.4) !important;
            }
            #dataTable td.cell-act::before { display: none; }
            .edit-link { width: 100% !important; justify-content: center; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); }
            .edit-txt { display: inline; margin-left: 6px; font-size: 13px; color: #fca5a5; }
            #searchSection.hero #searchPanel { padding: 20px 14px; }
        }
    </style>
</head>
<body class="bg-gray-900 bg-cover bg-center bg-no-repeat bg-fixed text-gray-100 h-screen p-2 sm:p-5 flex flex-col overflow-hidden" style="background-image: url('background.jpg');">
    <div class="max-w-7xl mx-auto w-full flex flex-col h-full overflow-hidden">

        <!-- Üst Bar -->
        <div class="glass flex-shrink-0 flex items-center justify-between gap-3 mb-2.5 p-3.5 sm:p-4 rounded-2xl shadow-xl border border-gray-700 border-opacity-50">
            <h1 class="text-lg sm:text-2xl font-bold text-red-500 tracking-wide">CMM Erişim Ekranı</h1>
            <a href="bilgi-ekle.html" class="btn-ghost">Bilgi ekle / düzelt</a>
        </div>

        <!-- Arama Bölümü -->
        <div id="searchSection" class="hero">
            <div id="searchPanel" class="glass">
                <div id="heroText">
                    <h2 class="text-xl sm:text-3xl font-bold">Uçağın kuyruk kodunu yazın</h2>
                    <p class="mt-1.5 text-gray-300 text-xs sm:text-base">Lokasyon, P/N ve CMM numarası tek aramada listelenir.</p>
                </div>
                <div id="inputWrap">
                    <input type="text" id="searchInput" class="search-box" placeholder="Örn. TC-LGI" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Kuyruk kodu veya kelime ara">
                    <button type="button" id="clearBtn" aria-label="Aramayı temizle" hidden>&times;</button>
                </div>
                <p id="status" class="mt-2.5 text-xs sm:text-sm text-gray-300" aria-live="polite">Veriler yükleniyor...</p>
                <div id="recent" class="mt-4 flex flex-wrap items-center justify-center gap-1.5" hidden>
                    <span class="text-xs text-gray-400 mr-1">Son aranan:</span>
                    <span id="recentChips" class="flex flex-wrap justify-center gap-1.5"></span>
                </div>
                <div id="resultBar" class="flex flex-wrap items-center gap-x-4 text-xs sm:text-sm text-gray-300" hidden aria-live="polite">
                    <span><strong id="resultCount" class="text-red-400 text-base">0</strong> sonuç bulundu</span>
                    <span class="hidden sm:inline text-gray-400">Hatalı satırlar için sağdaki düzenleme ikonunu kullanın.</span>
                </div>
            </div>
        </div>

        <!-- Hata -->
        <div id="errorMessage" class="flex-shrink-0 bg-red-900 bg-opacity-85 border border-red-500 text-red-200 px-4 py-3 rounded-xl flex items-center shadow-lg mb-3" role="alert" hidden>
            <span id="errorText"></span>
        </div>

        <!-- Tablo Kapsayıcısı -->
        <div id="tableContainer" class="table-wrap flex-grow flex flex-col min-h-0 rounded-2xl shadow-xl overflow-hidden" hidden>
            <div id="headWrap" class="head-bar flex-shrink-0">
                <table class="w-full text-left border-collapse table-fixed">
                    <colgroup id="colsHead"></colgroup>
                    <thead id="tableHead" class="text-xs uppercase tracking-wider"></thead>
                </table>
            </div>
            <div id="bodyScroll" class="body-scroll overflow-y-auto flex-grow min-h-0">
                <table id="dataTable" class="w-full text-left border-collapse table-fixed">
                    <colgroup id="colsBody"></colgroup>
                    <tbody id="tableBody" class="divide-y divide-gray-700 divide-opacity-30 text-xs sm:text-sm text-gray-300"></tbody>
                </table>
            </div>
        </div>

        <!-- Alt Bilgi -->
        <div class="flex-shrink-0 mt-2 text-xs text-gray-400 px-2 flex justify-between items-center">
            <span>Toplam kayıt: <span id="totalCount" class="font-semibold text-red-500">0</span></span>
            <span>CMM Finder v2.1</span>
        </div>
    </div>

    <script>
        const CSV_FILE_URL = "veri.csv";
        const CACHE_KEY = "cmm_finder_data_v2";
        const RECENT_KEY = "cmm_recent_v2";
        const PAGE_SIZE = 300;
        const MIN_CHARS = 2;
        const REPORT_PAGE = "bilgi-ekle.html";
        const REPORT_KEYS = ["tip", "kuyruk", "lokasyon", "pn", "cmm"];

        const COPY_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>';
        const EDIT_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>';

        let allData = [];
        let headers = [];
        let filtered = [];
        let terms = [];
        let recent = [];
        let loaded = false;
        let lastKey = null;

        const $ = id => document.getElementById(id);

        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function norm(s) {
            return String(s).replace(/İ/g, 'I').replace(/ı/g, 'I').toUpperCase();
        }

        function parseCSV(text) {
            const rows = [];
            let row = [], field = '', inQ = false;
            text = text.replace(/^﻿/, '');
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQ) {
                    if (c === '"') {
                        if (text[i + 1] === '"') { field += '"'; i++; } else { inQ = false; }
                    } else { field += c; }
                } else if (c === '"' && field === '') {
                    inQ = true;
                } else if (c === ',') {
                    row.push(field.trim()); field = '';
                } else if (c === '\n' || c === '\r') {
                    if (c === '\r' && text[i + 1] === '\n') i++;
                    row.push(field.trim()); field = '';
                    if (row.some(f => f !== '')) rows.push(row);
                    row = [];
                } else {
                    field += c;
                }
            }
            row.push(field.trim());
            if (row.some(f => f !== '')) rows.push(row);
            return rows;
        }

        function reportUrl(cells) {
            const p = new URLSearchParams();
            p.set('tur', 'Hatalı bilgi');
            REPORT_KEYS.forEach((k, i) => { if (cells[i]) p.set(k, cells[i]); });
            return REPORT_PAGE + '?' + p.toString();
        }

        function showError(msg) {
            $('errorText').textContent = msg;
            $('errorMessage').hidden = false;
            $('status').textContent = 'Veriler yüklenemedi.';
        }

        function loadData() {
            let cached = null;
            try { cached = localStorage.getItem(CACHE_KEY); } catch (e) {}
            if (cached) {
                processData(cached);
                fetchAndCacheData(cached, true);
            } else {
                fetchAndCacheData(null, false);
            }
        }

        async function fetchAndCacheData(previousText, silent) {
            try {
                const response = await fetch(CSV_FILE_URL, { cache: 'no-store' });
                if (!response.ok) throw new Error('CSV dosyası sunucudan alınamadı.');
                const csvText = await response.text();
                if (csvText !== previousText) {
                    try { localStorage.setItem(CACHE_KEY, csvText); } catch (e) {}
                    processData(csvText);
                }
            } catch (error) {
                if (!silent) showError('Hata: ' + error.message);
            }
        }

        function processData(csvText) {
            const rows = parseCSV(csvText);
            if (!rows.length) { showError('Tabloda görüntülenecek veri bulunamadı.'); return; }
            headers = rows[0];
            allData = rows.slice(1).map(cells => {
                const c = headers.map((_, i) => cells[i] !== undefined ? cells[i] : '');
                return { cells: c, search: norm(c.join(' ')) };
            });
            loaded = true;
            $('errorMessage').hidden = true;
            $('totalCount').textContent = allData.length.toLocaleString('tr-TR');
            $('status').textContent = allData.length.toLocaleString('tr-TR') + ' kayıt hazır';
            update(true);
        }

        function loadRecent() {
            try {
                const r = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
                if (Array.isArray(r)) recent = r.filter(x => typeof x === 'string' && x.length <= 40).slice(0, 4);
            } catch (e) { recent = []; }
        }

        function saveRecent() {
            const q = $('searchInput').value.trim().toUpperCase();
            if (!loaded || !filtered.length || q.replace(/\s+/g, '').length < MIN_CHARS) return;
            recent = [q].concat(recent.filter(x => x !== q)).slice(0, 4);
            try { localStorage.setItem(RECENT_KEY, JSON.stringify(recent)); } catch (e) {}
        }

        function renderRecent() {
            $('recentChips').innerHTML = recent.map(q =>
                '<button type="button" class="chip" onclick="applyRecent(\'' + esc(q) + '\')">' + esc(q) + '</button>'
            ).join('');
        }

        window.applyRecent = function(q) {
            $('searchInput').value = q;
            update(true);
            $('searchInput').focus();
        };

        function update(force) {
            const input = $('searchInput');
            terms = norm(input.value).split(/\s+/).filter(Boolean);
            const active = terms.join('').length >= MIN_CHARS;

            $('clearBtn').hidden = !input.value;
            $('searchSection').classList.toggle('hero', !active);
            $('heroText').hidden = active;
            $('status').hidden = active;
            $('resultBar').hidden = !active;

            if (!active) {
                loadRecent();
                $('recent').hidden = !recent.length;
                renderRecent();
                $('tableContainer').hidden = true;
                lastKey = null;
                return;
            }
            $('recent').hidden = true;

            if (!loaded) {
                $('resultCount').textContent = '...';
                $('tableContainer').hidden = true;
                return;
            }

            const key = terms.join(' ');
            if (!force && key === lastKey) return;
            lastKey = key;

            filtered = allData.filter(r => terms.every(t => r.search.includes(t)));
            saveRecent();
            renderTable();
        }

        function syncHeadWidth() {
            const scroller = $('bodyScroll');
            if (scroller && $('headWrap')) {
                $('headWrap').style.paddingRight = (scroller.offsetWidth - scroller.clientWidth) + 'px';
            }
        }

        function renderTable() {
            const visible = filtered.slice(0, PAGE_SIZE);
            $('resultCount').textContent = filtered.length.toLocaleString('tr-TR');

            // Sütun genişlikleri
            const colCount = headers.length + 1; // 1 kolon da işlem için
            const colGroupHtml = headers.map(() => '<col>').concat('<col style="width: 70px;">').join('');
            $('colsHead').innerHTML = colGroupHtml;
            $('colsBody').innerHTML = colGroupHtml;

            let headHtml = '<tr>';
            headers.forEach(h => {
                headHtml += '<th class="px-3 py-3.5 font-semibold truncate">' + esc(h) + '</th>';
            });
            headHtml += '<th class="px-2 py-3.5 text-center font-semibold">İşlem</th></tr>';
            $('tableHead').innerHTML = headHtml;

            let bodyHtml = '';
            visible.forEach(row => {
                bodyHtml += '<tr class="hover:bg-gray-800 hover:bg-opacity-40 transition-colors">';
                row.cells.forEach((val, i) => {
                    const head = String(headers[i] || '').toLowerCase();
                    const label = esc(headers[i] || '');
                    const v = esc(val);
                    const tdOpen = '<td class="px-3.5 py-3 text-gray-300 whitespace-nowrap" data-label="' + label + '">';

                    if (head.includes('cmm') && val) {
                        bodyHtml += tdOpen + '<a href="https://ttdocs.thyteknik.com/documents/?q:document_chapter:icontains=' + encodeURIComponent(val) +
                            '" target="_blank" rel="noopener noreferrer" class="text-red-400 hover:text-red-300 underline font-medium">' + v + '</a></td>';
                    } else {
                        bodyHtml += tdOpen + '<span class="block truncate" title="' + v + '">' + v + '</span></td>';
                    }
                });
                bodyHtml += '<td class="px-2 py-3 text-center cell-act"><a href="' + esc(reportUrl(row.cells)) + '" class="icon-btn edit-link" ' +
                    'title="Hatalı / eksik bildir" aria-label="Hatalı / eksik bildir">' +
                    EDIT_ICON + '<span class="edit-txt">Hatalı / eksik bildir</span></a></td>';
                bodyHtml += '</tr>';
            });
            $('tableBody').textContent = ''; // clear
            $('tableBody').innerHTML = bodyHtml;

            $('tableContainer').hidden = false;
            setTimeout(syncHeadWidth, 50);
        }

        $('searchInput').addEventListener('input', () => update(false));
        $('clearBtn').addEventListener('click', () => {
            $('searchInput').value = '';
            update(true);
            $('searchInput').focus();
        });

        window.addEventListener('resize', syncHeadWidth);
        loadData();
        loadRecent();
    </script>
</body>
</html>
