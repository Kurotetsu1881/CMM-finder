<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMM Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[url('background.jpg')] bg-cover bg-center bg-no-repeat bg-fixed text-gray-100 min-h-screen p-6 flex flex-col">
    <div class="max-w-7xl mx-auto w-full flex flex-col h-full"> 
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 bg-gray-900/10 p-6 rounded-2xl shadow-xl border border-gray-700/5 backdrop-blur-sm">
            <div>
                <h1 class="text-2xl font-bold text-red-500 tracking-wide">CMM Erişim Ekranı</h1>
            </div>
            <div class="w-full md:w-72">
                <input type="text" id="searchInput" placeholder="Tabloda ara..." class="w-full bg-gray-950/40 border border-gray-700/30 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-red-500 transition-colors backdrop-blur-sm">
            </div>
        </div>

        <div id="loading" class="flex flex-col items-center justify-center py-20 flex-grow">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-500 mb-4"></div>
            <p class="text-gray-400 text-sm">Veriler yükleniyor, lütfen bekleyin...</p>
        </div>

        <div id="errorMessage" class="hidden bg-red-900/50 border border-red-500 text-red-200 px-6 py-4 rounded-xl flex items-center shadow-lg">
            <svg class="w-6 h-6 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.667.192 3 1.732 3z"></path></svg>
            <span id="errorText"></span>
        </div>

        <div id="tableContainer" class="hidden flex flex-col flex-grow bg-gray-950/10 rounded-2xl border border-gray-700/5 shadow-xl overflow-hidden backdrop-blur-sm min-h-[400px] max-h-[600px]">
            <div class="overflow-y-auto flex-grow">
                <table id="dataTable" class="w-full text-left border-collapse table-fixed">
                    <!-- Başlık kısmı istenildiği gibi daha şeffaf yapıldı -->
                    <thead id="tableHead" class="bg-gray-950/20 text-gray-300 text-xs uppercase tracking-wider sticky top-0 z-20 shadow-md backdrop-blur-md">
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-700/5 text-sm text-gray-300">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="flex justify-between items-center mt-6 text-xs text-gray-400 px-2 mt-auto">
            <span>Toplam Kayıt: <span id="rowCount" class="font-semibold text-red-500">0</span></span>
            <button onclick="refreshData()" class="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1 rounded-md transition-colors font-medium shadow-sm text-[11px]">
                Verileri Temizle
            </button>
        </div>
    </div>

    <script>
        const CSV_FILE_URL = "veri.csv";
        const CACHE_KEY = "cmm_finder_data";
        let allData = [];
        let headers = [];

        async function loadData() {
            const loading = document.getElementById('loading');
            const tableContainer = document.getElementById('tableContainer');
            const errorMessage = document.getElementById('errorMessage');

            loading.classList.remove('hidden');
            tableContainer.classList.add('hidden');
            errorMessage.classList.add('hidden');

            const cachedData = localStorage.getItem(CACHE_KEY);

            if (cachedData) {
                processData(cachedData);
            } else {
                fetchAndCacheData();
            }
        }

        async function fetchAndCacheData() {
            const loading = document.getElementById('loading');
            try {
                const response = await fetch(CSV_FILE_URL);
                if (!response.ok) throw new Error('CSV dosyası sunucudan alınamadı.');
                
                const csvText = await response.text();
                localStorage.setItem(CACHE_KEY, csvText);
                processData(csvText);
            } catch (error) {
                loading.classList.add('hidden');
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('errorText').textContent = "Hata: " + error.message;
            }
        }

        function processData(csvText) {
            const rawData = parseCSV(csvText);
            
            if (Array.isArray(rawData) && rawData.length > 0) {
                headers = rawData[0];
                allData = rawData.slice(1).map(row => {
                    let obj = {};
                    headers.forEach((h, i) => {
                        obj[h] = row[i] !== undefined ? row[i] : '';
                    });
                    return obj;
                });
                
                renderTable(allData);
            } else {
                document.getElementById('loading').classList.add('hidden');
                throw new Error('Tabloda görüntülenecek veri bulunamadı.');
            }
        }

        function refreshData() {
            localStorage.removeItem(CACHE_KEY);
            const searchInput = document.getElementById('searchInput');
            searchInput.value = '';
            fetchAndCacheData();
        }

        function parseCSV(text) {
            let lines = text.split('\n');
            let result = [];
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line) {
                    let row = line.split(',').map(item => item.replace(/^["']|["']$/g, '').trim());
                    result.push(row);
                }
            }
            return result;
        }

        function renderTable(data) {
            const tHead = document.getElementById('tableHead');i
            const tBody = document.getElementById('tableBody');
            const loading = document.getElementById('loading');
            const tableContainer = document.getElementById('tableContainer');

            let headHtml = '<tr>';
            headers.forEach(header => {
                headHtml += `<th class="px-3 py-4 font-semibold truncate">${header}</th>`;
            });
            headHtml += '</tr>';
            tHead.innerHTML = headHtml;

            let bodyHtml = '';
            data.forEach((row, index) => {
                bodyHtml += `<tr class="hover:bg-gray-800/20 transition-colors bg-transparent">`;
                headers.forEach(header => {
                    let cellValue = row[header] !== undefined ? row[header] : '';
                    
                    if (header.toLowerCase().includes('cmm') && cellValue) {
                        bodyHtml += `<td class="px-3 py-4 text-gray-300 whitespace-nowrap truncate">
                                        <a href="https://ttdocs.thyteknik.com/documents/?q:document_chapter:icontains=${cellValue}" target="_blank" class="text-red-400 hover:text-red-300 underline font-medium">
                                            ${cellValue}
                                        </a>
                                     </td>`;
                    } else {
                        bodyHtml += `<td class="px-3 py-4 text-gray-300 whitespace-nowrap truncate">${cellValue}</td>`;
                    }
                });
                bodyHtml += '</tr>';
            });
            tBody.innerHTML = bodyHtml;

            document.getElementById('rowCount').textContent = data.length;

            loading.classList.add('hidden');
            tableContainer.classList.remove('hidden');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allData.filter(row => {
                return Object.values(row).some(val => 
                    String(val).toLowerCase().includes(term)
                );
            });
            renderTable(filtered);
        });

        loadData();
    </script>
</body>
</html>
