<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMM Finder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }

        /* Üst başlık barı: daha şeffaf */
        .top-bar {
            background: rgba(17, 24, 39, 0.55);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }

        /* Arama kutusu: koyu zemin, açık renk yazı */
        .search-box {
            background: rgba(3, 7, 18, 0.85);
            color: #ffffff;
            -webkit-text-fill-color: #ffffff;
        }
        .search-box::placeholder { color: #9ca3af; }

        /* Tablo paneli: daha opak */
        .table-panel {
            background: rgba(3, 7, 18, 0.95);
        }

        /* Başlık satırı: her th sticky ve tam opak, üst üste binme olmaz */
        #tableHead th {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #030712;
            color: #e5e7eb;
        }
    </style>
</head>
<body class="bg-gray-900 bg-cover bg-center bg-no-repeat bg-fixed text-gray-100 h-screen p-6 flex flex-col overflow-hidden" style="background-image: url('background.jpg');">
    <div class="max-w-7xl mx-auto w-full flex flex-col h-full overflow-hidden">

        <!-- Üst Arama ve Başlık Barı -->
        <div class="top-bar flex-shrink-0 flex flex-col md:flex-row justify-between items-center mb-4 gap-4 p-5 rounded-2xl shadow-xl border border-gray-700 border-opacity-50">
            <div>
                <h1 class="text-2xl font-bold text-red-500 tracking-wide">CMM Erişim Ekranı</h1>
            </div>
            <div class="w-full md:w-72">
                <input type="text" id="searchInput" placeholder="Tabloda ara..." class="search-box w-full border border-gray-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-red-500 transition-colors">
            </div>
        </div>

        <!-- Yükleniyor Göstergesi -->
        <div id="loading" class="flex flex-col items-center justify-center py-20 flex-grow">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-500 mb-4"></div>
            <p class="text-gray-300 text-sm">Veriler yükleniyor, lütfen bekleyin...</p>
        </div>

        <!-- Hata Mesajı -->
        <div id="errorMessage" class="hidden flex-shrink-0 bg-red-900 bg-opacity-80 border border-red-500 text-red-200 px-6 py-4 rounded-xl flex items-center shadow-lg mb-4">
            <svg class="w-6 h-6 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.667.192 3 1.732 3z"></path></svg>
            <span id="errorText"></span>
        </div>

        <!-- Tablo Kapsayıcısı -->
        <div id="tableContainer" class="table-panel hidden flex-grow flex flex-col min-h-0 rounded-2xl border border-gray-700 border-opacity-50 shadow-xl overflow-hidden">
            <div class="overflow-y-auto flex-grow relative">
                <table id="dataTable" class="w-full text-left border-collapse table-fixed">
                    <thead id="tableHead" class="text-xs uppercase tracking-wider shadow-md">
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-700 divide-opacity-40 text-sm text-gray-300">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Alt Bilgi / Footer -->
        <div class="flex-shrink-0 flex justify-between items-center mt-3 text-xs text-gray-400 px-2">
            <span>Toplam Kayıt: <span id="rowCount" class="font-semibold text-red-500">0</span></span>
            <button onclick="refreshData()" class="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1 rounded-md transition-colors font-medium shadow-sm text-xs">
                Verileri Temizle
            </button>
        </div>

    </div>

    <script>
        const CSV_FILE_URL = "veri.csv";
        const CACHE_KEY = "cmm_finder_data";
        let allData = [];
        let headers = [];

        async function loadData() {
            const loading = document.getElementById('loading');
            const tableContainer = document.getElementById('tableContainer');
            const errorMessage = document.getElementById('errorMessage');

            loading.classList.remove('hidden');
            tableContainer.classList.add('hidden');
            errorMessage.classList.add('hidden');

            const cachedData = localStorage.getItem(CACHE_KEY);

            if (cachedData) {
                processData(cachedData);
            } else {
                fetchAndCacheData();
            }
        }

        async function fetchAndCacheData() {
            try {
                const response = await fetch(CSV_FILE_URL);
                if (!response.ok) throw new Error('CSV dosyası sunucudan alınamadı.');

                const csvText = await response.text();
                localStorage.setItem(CACHE_KEY, csvText);
                processData(csvText);
            } catch (error) {
                const loading = document.getElementById('loading');
                loading.classList.add('hidden');
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('errorText').textContent = "Hata: " + error.message;
            }
        }

        function processData(csvText) {
            const rawData = parseCSV(csvText);

            if (Array.isArray(rawData) && rawData.length > 0) {
                headers = rawData[0];
                allData = rawData.slice(1).map(row => {
                    let obj = {};
                    headers.forEach((h, i) => {
                        obj[h] = row[i] !== undefined ? row[i] : '';
                    });
                    return obj;
                });

                renderTable(allData);
            } else {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('errorText').textContent = 'Tabloda görüntülenecek veri bulunamadı.';
            }
        }

        function refreshData() {
            localStorage.removeItem(CACHE_KEY);
            const searchInput = document.getElementById('searchInput');
            searchInput.value = '';
            fetchAndCacheData();
        }

        function parseCSV(text) {
            let lines = text.split('\n');
            let result = [];
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line) {
                    let row = line.split(',').map(item => item.replace(/^["']|["']$/g, '').trim());
                    result.push(row);
                }
            }
            return result;
        }

        function renderTable(data) {
            const tHead = document.getElementById('tableHead');
            const tBody = document.getElementById('tableBody');
            const loading = document.getElementById('loading');
            const tableContainer = document.getElementById('tableContainer');

            let headHtml = '<tr>';
            headers.forEach(header => {
                headHtml += `<th class="px-3 py-4 font-semibold truncate">${header}</th>`;
            });
            headHtml += '</tr>';
            tHead.innerHTML = headHtml;

            let bodyHtml = '';
            data.forEach((row) => {
                bodyHtml += `<tr class="hover:bg-gray-800 hover:bg-opacity-40 transition-colors">`;
                headers.forEach(header => {
                    let cellValue = row[header] !== undefined ? row[header] : '';

                    if (header.toLowerCase().includes('cmm') && cellValue) {
                        bodyHtml += `<td class="px-3 py-4 text-gray-300 whitespace-nowrap truncate">
                                        <a href="https://ttdocs.thyteknik.com/documents/?q:document_chapter:icontains=${cellValue}" target="_blank" class="text-red-400 hover:text-red-300 underline font-medium">
                                            ${cellValue}
                                        </a>
                                     </td>`;
                    } else {
                        bodyHtml += `<td class="px-3 py-4 text-gray-300 whitespace-nowrap truncate">${cellValue}</td>`;
                    }
                });
                bodyHtml += '</tr>';
            });
            tBody.innerHTML = bodyHtml;

            document.getElementById('rowCount').textContent = data.length;

            loading.classList.add('hidden');
            tableContainer.classList.remove('hidden');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allData.filter(row => {
                return Object.values(row).some(val =>
                    String(val).toLowerCase().includes(term)
                );
            });
            renderTable(filtered);
        });

        loadData();
    </script>
</body>
</html>
